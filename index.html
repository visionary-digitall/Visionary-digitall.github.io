<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Visionary Digital | Websites, Graphics, Research & AI Tools</title>
<meta name="description" content="Visionary Digital: website design, graphics and logos, research, and AI tool sourcing for anyone, anywhere. DM for a quote.">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08080a; --bg2:#101014; --card:#14141a; --line:#3a3015;
  --gold:#d4af37; --gold2:#f0d27a; --text:#f4f1e8; --muted:#a9a596; --ink:#0a0a0c;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#08080a;--bg2:#101014;--card:#14141a;--line:#3a3015;--gold:#d4af37;--gold2:#f0d27a;--text:#f4f1e8;--muted:#a9a596;--ink:#0a0a0c}}
:root[data-theme="dark"]{--bg:#08080a;--bg2:#101014;--card:#14141a;--line:#3a3015;--gold:#d4af37;--gold2:#f0d27a;--text:#f4f1e8;--muted:#a9a596;--ink:#0a0a0c}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
a{color:inherit;text-decoration:none}
.wrap{width:100%;max-width:1040px;margin:0 auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:rgba(8,8,10,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.04em}
.mark{width:40px;height:40px;border-radius:50%;object-fit:cover;mix-blend-mode:lighten;display:block}
.logo span.n{font-size:15px}
.nav a.cta{background:var(--gold);color:var(--ink);padding:9px 16px;border-radius:999px;font-weight:600;font-size:13px}
.links{display:none;gap:22px;font-size:14px;color:var(--muted)}
.links a:hover{color:var(--gold)}
@media(min-width:760px){.links{display:flex}}
.hero{position:relative;text-align:center;padding:40px 0 56px;background:radial-gradient(circle at 50% 0%,rgba(212,175,55,.18),transparent 60%)}
.herologo{width:min(300px,70vw);height:auto;mix-blend-mode:lighten;margin:0 auto 6px}
.tag{display:inline-block;border:1px solid var(--line);color:var(--gold);padding:6px 14px;border-radius:999px;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
h1{font-size:clamp(32px,7vw,58px);line-height:1.12;margin:18px 0 14px;font-weight:700;color:var(--gold2)}
.hero p.lead{max-width:620px;margin:0 auto 26px;color:var(--muted);font-size:clamp(15px,2.4vw,18px)}
.btns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.btn{display:inline-block;padding:14px 26px;border-radius:12px;font-weight:600;font-size:15px;border:1px solid var(--gold)}
.btn.p{background:linear-gradient(180deg,var(--gold2),var(--gold));color:var(--ink)}
.btn.s{color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:28px;font-size:13px;color:var(--muted)}
.chips span{border:1px solid var(--line);padding:6px 14px;border-radius:999px}
section{padding:56px 0}
section.alt{background:var(--bg2);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.eyebrow{color:var(--gold);font-size:12px;letter-spacing:.14em;text-transform:uppercase;text-align:center;font-weight:600}
h2{text-align:center;font-size:clamp(26px,5vw,38px);margin:8px 0 10px;line-height:1.2}
.sub{text-align:center;color:var(--muted);max-width:620px;margin:0 auto 34px}
.grid{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:640px){.grid.two{grid-template-columns:1fr 1fr}.grid.three{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px}
.card .ic{width:46px;height:46px;border-radius:12px;border:1px solid var(--gold);display:grid;place-items:center;margin-bottom:14px}
.card .ic svg{width:24px;height:24px;stroke:var(--gold);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card h3{margin:0 0 6px;font-size:18px;color:var(--gold2)}
.card p{margin:0;color:var(--muted);font-size:14.5px}
.card ul{margin:12px 0 0;padding-left:18px;color:var(--text);font-size:14px}
.card li{margin:4px 0}
.step .num{font-size:34px;font-weight:700;color:var(--gold);line-height:1;margin-bottom:10px}
.quote{text-align:center;max-width:700px;margin:0 auto}
.quote .box{border:1px solid var(--gold);border-radius:20px;padding:30px 22px;background:linear-gradient(180deg,rgba(212,175,55,.08),transparent)}
.quote h3{margin:0 0 8px;font-size:22px;color:var(--gold2)}
.quote p{margin:0 0 18px;color:var(--muted)}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:12px}
summary{cursor:pointer;font-weight:600;color:var(--gold2)}
details p{margin:10px 0 0;color:var(--muted);font-size:14.5px}
.faq{max-width:720px;margin:0 auto}
.about{max-width:720px;margin:0 auto;text-align:center;color:var(--muted)}
.about p{margin:0 0 14px}
.contact .grid{max-width:720px;margin:0 auto}
.contact .card{text-align:center}
.contact .card a.v{display:block;margin-top:8px;color:var(--gold);font-weight:600;word-break:break-all}
footer{text-align:center;padding:30px 20px 34px;color:var(--muted);font-size:13px;border-top:1px solid var(--line)}
footer b{color:var(--gold)}
</style>
</head>
